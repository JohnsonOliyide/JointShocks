<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
body { max-width: none; width: auto; margin: 0; padding: 0; background: #fff; color: #606c71; font: 18px/1.6 "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
.tutorial-banner { text-align: center; color: white; background: linear-gradient(120deg, #155799, #159957); padding: 38px 24px 34px; }
.tutorial-banner .title { margin: 0 0 14px; color: white; font-size: 36px; font-weight: 700; line-height: 1.3; letter-spacing: 0; }
.tutorial-banner .subtitle { margin: 0 0 10px; color: rgba(255,255,255,.75); font-size: 23px; font-weight: 400; }
.tutorial-banner .author { margin: 0; padding: 0; border: 0; color: rgba(255,255,255,.8); font-size: 15px; font-weight: 400; }
.tutorial-main { max-width: 1024px; margin: 0 auto; padding: 32px 64px 80px; }
h1,h2,h3,h4 { color: #159957; font-weight: 400; line-height: 1.35; border: 0; padding: 0; }
.section > h1 { margin: 34px 0 20px; font-size: 29px; }
h2 { margin: 32px 0 18px; font-size: 25px; }
h3 { margin: 28px 0 16px; font-size: 21px; }
h3 strong { font-weight: 400; }
p { margin: 0 0 22px; }
a, a:visited { color: #1e6bb8; text-decoration: none; }
a:hover { text-decoration: underline; }
.header-section-number, .toc-section-number { display: none; }
#TOC { position: static; width: auto; height: auto; margin: 0 0 32px; padding: 22px 26px; border: 1px solid #dce6f0; border-radius: 5px; background: #f3f6fa; font-size: 17px; line-height: 1.5; }
#TOC::before { display: none; }
#TOC ul, #TOC ul ul { margin: 0; padding-left: 22px; }
#TOC ul ul { border: 0; }
#TOC li { line-height: 1.5; margin: 0; list-style: disc outside; }
#TOC ul ul li { list-style: circle outside; }
#TOC a { color: #1e6bb8; }
pre, pre:not([class]) { position: relative; margin: 18px 0 30px; padding: 14px 16px; background: #f3f6fa; border: 1px solid #dce6f0; border-radius: 5px; overflow-x: auto; color: #567482; }
pre.sourceCode { padding-right: 72px; }
div.sourceCode { margin: 18px 0 30px; }
code { font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; line-height: 1.55; background: #f3f6fa; color: #567482; }
pre code, pre > code.sourceCode { white-space: pre; background: transparent; }
pre > code.sourceCode > span { line-height: 1.55; }
p > code, li > code { padding: 2px 5px; border-radius: 3px; }
.copy-code { position: absolute; top: 7px; right: 7px; padding: 3px 7px; border: 1px solid #d0dbe5; border-radius: 3px; background: #fff; color: #567482; font: 11px Arial,sans-serif; cursor: pointer; }
.copy-code:hover { color: #1e6bb8; border-color: #1e6bb8; }
a:focus-visible, button:focus-visible { outline: 2px solid #1e6bb8; outline-offset: 3px; }
img { display: block; max-width: 100%; height: auto; padding: 0; border: 0; margin: 28px auto; }
table { display: block; width: 100%; border: 0; border-collapse: collapse; overflow-x: auto; margin: 24px 0; font-size: 15px; }
table th, table td { padding: 8px 13px; border: 1px solid #e9ebec; white-space: nowrap; }
table thead { background: #f3f6fa; }
blockquote { border-left: 4px solid #dce6f0; padding: 4px 20px; background: transparent; }
.csl-entry { font-size: 15px; margin-bottom: 16px !important; }
@media (max-width: 700px) { .tutorial-main { padding: 24px 22px 60px; } .tutorial-banner { padding: 30px 20px; } .tutorial-banner .title { font-size: 30px; } body { font-size: 16px; } #TOC { font-size: 16px; padding: 18px; } .section > h1 { font-size: 26px; } h2 { font-size: 23px; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
@media print { .copy-code, #TOC { display: none; } .tutorial-banner { background: white; color: black; } .tutorial-banner .title, .tutorial-banner .author, .tutorial-banner .subtitle { color: black; } .tutorial-main { max-width: none; padding: 0; } pre, pre code { white-space: pre-wrap !important; } }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (!document.querySelector(".tutorial-banner")) {
    var banner = document.createElement("header"); banner.className = "tutorial-banner";
    var title = document.querySelector("h1.title"), author = document.querySelector(".author");
    if (title) { title.textContent = "JointShocks"; banner.appendChild(title); }
    var subtitle = document.createElement("p"); subtitle.className = "subtitle"; subtitle.textContent = "R Package Tutorial"; banner.appendChild(subtitle);
    if (author) banner.appendChild(author);
    var main = document.createElement("main"); main.className = "tutorial-main";
    Array.from(document.body.childNodes).forEach(function(node) { main.appendChild(node); });
    document.body.appendChild(banner); document.body.appendChild(main);
  }
  var toc = document.querySelector("#TOC");
  if (toc) { toc.setAttribute("role", "navigation"); toc.setAttribute("aria-label", "Tutorial sections"); }
  var labels = ["Overview", "Installation", "Load your data", "Example dataset", "Empirical analysis", "Impulse responses and variance decompositions", "Spillover metrics"];
  if (toc) toc.querySelectorAll("a").forEach(function(a, i) { if (labels[i]) a.textContent = labels[i]; });
  document.querySelectorAll("pre.sourceCode").forEach(function (pre) {
    var button = document.createElement("button");
    button.className = "copy-code"; button.type = "button"; button.textContent = "Copy";
    button.setAttribute("aria-label", "Copy R code");
    button.addEventListener("click", async function () {
      try { await navigator.clipboard.writeText(pre.querySelector("code").textContent); button.textContent = "Copied"; }
      catch (e) { button.textContent = "Select code"; var range = document.createRange(); range.selectNodeContents(pre.querySelector("code")); var selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range); }
      setTimeout(function () { button.textContent = "Copy"; }, 1800);
    });
    pre.appendChild(button);
  });
  if (toc && "IntersectionObserver" in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (!entry.isIntersecting) return;
        toc.querySelectorAll("a").forEach(function(a) {
          if (a.hash.slice(1) === entry.target.id) a.setAttribute("aria-current", "location");
          else a.removeAttribute("aria-current");
        });
      });
    }, { rootMargin: "-10% 0px -65% 0px" });
    toc.querySelectorAll("a").forEach(function(a) { var section = document.getElementById(a.hash.slice(1)); if (section) observer.observe(section); });
  }
});
</script>
