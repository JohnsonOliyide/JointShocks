name: Render tutorial
on:
  push:
    branches: [main]
    paths:
      - 'vignettes/JointShocks.Rmd'
      - 'vignettes/tutorial-header.html'
      - 'vignettes/tutorial-pdf.tex'
      - 'vignettes/references.bib'
      - 'scripts/render-tutorial.R'
      - '.github/workflows/render-tutorial.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rmarkdown
            any::readxl
          needs: website
      - name: Render matching HTML and PDF tutorials
        run: Rscript scripts/render-tutorial.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-tutorial
          path: |
            docs/index.html
            vignettes/JointShocks.pdf
            vignettes/JointShocks.tex
            consistency-check.txt
