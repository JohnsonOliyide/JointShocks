name: Render tutorial
on:
  push:
    branches: [main]
    paths:
      - 'vignettes/JointShocks.Rmd'
      - 'vignettes/tutorial-header.html'
      - 'vignettes/references.bib'
      - 'scripts/render-tutorial.R'
      - '.github/workflows/render-tutorial.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rmarkdown
            any::readxl
          needs: website
      - name: Render all examples and figures
        run: Rscript scripts/render-tutorial.R
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-tutorial
          path: docs/index.html
      - name: Export rendered preview for review
        run: |
          python - <<'PYTHON'
          import base64, gzip
          from pathlib import Path
          payload = base64.b64encode(gzip.compress(Path("docs/index.html").read_bytes())).decode()
          print("TUTORIAL_HTML_GZIP_BASE64=" + payload)
          PYTHON
